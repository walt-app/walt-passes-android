name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "17"
          distribution: "temurin"

      # Use the Android SDK preinstalled on ubuntu-latest. Top up the
      # specific platform / build-tools the modules need via sdkmanager. We
      # cannot use android-actions/setup-android because the publisher org
      # is not on the repo's verified-actions allowlist.
      - name: Top up Android SDK packages
        run: |
          set -eu
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Forks must not be able to write to the build cache.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      # assembleDebugAndroidTest compiles the androidTest sources (no device needed) so the
      # instrumented suites typecheck on every PR, including @Ignore'd stubs no device runs.
      - name: Build, test, lint
        run: ./gradlew check assemble assembleDebugAndroidTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/detekt/
            **/build/reports/ktlint/
          if-no-files-found: ignore

  connected-tests:
    name: Connected tests (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    strategy:
      # Each leg is independent; surfacing all failures at once is more useful than
      # short-circuiting on the first slow API. Per-job timeout cap is set below.
      fail-fast: false
      matrix:
        api: [28, 31, 34, 36]
    # Measured: 4.5 to 8.5min for the five-cycle legs, 9.5min for API 34's seven cycles.
    timeout-minutes: ${{ matrix.api == 34 && 90 || 70 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Gradle managed devices launch a real Android emulator under /dev/kvm. The
      # ubuntu-latest runner image has KVM available, but the runner user is not in
      # the kvm group by default. The udev rule below opens /dev/kvm to the runner
      # without elevating the test process itself.
      - name: Enable KVM access
        run: |
          set -eu
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "17"
          distribution: "temurin"

      # Same allowlist constraint as the build job: third-party actions
      # (android-actions/setup-android, ReactiveCircus/android-emulator-runner) are not
      # available, so we top up the SDK in-place via sdkmanager. AGP's managed devices
      # provisioner can pull system images on demand, but is finicky about license
      # acceptance; pre-accepting + pre-installing is more reliable on cold runners.
      - name: Top up Android SDK packages
        run: |
          set -eu
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-${{ matrix.api }};google_apis;x86_64"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Forks must not be able to write to the build cache.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      # Per-API task name matches the localDevices entries declared in each module's
      # build.gradle.kts. The DebugAndroidTest suffix runs the androidTest sources against
      # the debug variant. passes-barcode runs the wpass-zrt.5 on-device security suite.
      #
      # One module per step, deliberately (wpass-qw3). Passing both tasks to one invocation let
      # org.gradle.parallel start both managed devices at once, so two emulators shared a
      # 4-core runner and the isolated-process decode blew its watchdog budget on API 36.
      # Separate steps make the serialization structural rather than a Gradle scheduling flag,
      # at the cost of a second Gradle invocation and device cycle per API level.
      - name: Run connected tests (passes-storage)
        id: storage-connected
        run: ./gradlew :passes-storage:api${{ matrix.api }}googleDebugAndroidTest --stacktrace

      # Runs whenever the connected legs started, so one module's failure cannot hide
      # another's. The `!= 'skipped'` keeps a setup failure from triggering a confusing second
      # failure here, which a bare `!cancelled()` would.
      - name: Run connected tests (passes-barcode)
        if: ${{ !cancelled() && steps.storage-connected.conclusion != 'skipped' }}
        run: ./gradlew :passes-barcode:api${{ matrix.api }}googleDebugAndroidTest --stacktrace

      # passes-ui carries the wpass-80y.5 face-tint pin, which reads painted pixels and so
      # cannot run under Robolectric. Same condition and reasoning as the step above.
      - name: Run connected tests (passes-ui)
        if: ${{ !cancelled() && steps.storage-connected.conclusion != 'skipped' }}
        run: ./gradlew :passes-ui:api${{ matrix.api }}googleDebugAndroidTest --stacktrace

      # passes-image and passes-image-decode pin ImageDecoder behaviour, which varies by API level.
      - name: Run connected tests (passes-image)
        if: ${{ !cancelled() && steps.storage-connected.conclusion != 'skipped' }}
        run: ./gradlew :passes-image:api${{ matrix.api }}googleDebugAndroidTest --stacktrace

      - name: Run connected tests (passes-image-decode)
        if: ${{ !cancelled() && steps.storage-connected.conclusion != 'skipped' }}
        run: ./gradlew :passes-image-decode:api${{ matrix.api }}googleDebugAndroidTest --stacktrace

      # The document surfaces run on API 34 only, to keep the other legs' wall time down.
      - name: Run connected tests (passes-document-ui)
        if: ${{ !cancelled() && steps.storage-connected.conclusion != 'skipped' && matrix.api == 34 }}
        run: ./gradlew :passes-document-ui:api34googleDebugAndroidTest --stacktrace

      - name: Run connected tests (passes-document)
        if: ${{ !cancelled() && steps.storage-connected.conclusion != 'skipped' && matrix.api == 34 }}
        run: ./gradlew :passes-document:api34googleDebugAndroidTest --stacktrace

      - name: Upload connected test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connected-test-reports-api${{ matrix.api }}
          path: |
            passes-storage/build/reports/androidTests/
            passes-storage/build/outputs/androidTest-results/
            passes-barcode/build/reports/androidTests/
            passes-barcode/build/outputs/androidTest-results/
            passes-ui/build/reports/androidTests/
            passes-ui/build/outputs/androidTest-results/
            passes-document-ui/build/reports/androidTests/
            passes-document-ui/build/outputs/androidTest-results/
            passes-document/build/reports/androidTests/
            passes-document/build/outputs/androidTest-results/
            passes-image/build/reports/androidTests/
            passes-image/build/outputs/androidTest-results/
            passes-image-decode/build/reports/androidTests/
            passes-image-decode/build/outputs/androidTest-results/
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
